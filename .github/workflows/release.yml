name: Release

# Only tags starting with "v" trigger a release, so a tag ruleset on "v*" can
# restrict who may create them. Other tags are ignored.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install --upgrade pip build twine

      # Fail before any PyPI upload: the github-release job could not create it.
      - name: Check that the tag has no GitHub release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already has a GitHub release; publication cancelled."
            exit 1
          fi

      - name: Build distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      # The built files are named after __version__: the tag must be "v" followed
      # by that exact normalized version, e.g. v1.2.3 or v1.2.3rc1.
      - name: Check that the tag matches the built version
        id: validate
        run: |
          version="${RELEASE_TAG#v}"
          if ! ls dist/vtherm_api-"$version"-*.whl dist/vtherm_api-"$version".tar.gz >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG does not match the built version: $(ls dist | tr '\n' ' ')"
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc)[0-9]+|\.dev[0-9]+ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "Version $version, pre-release: $prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # release/v1
        with:
          packages-dir: dist/
          verbose: true

  github-release:
    name: Create GitHub release
    needs: [validate, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # Notes are generated by GitHub: merged pull requests since the previous release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--title "vtherm_api $VERSION" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
