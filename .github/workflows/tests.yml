name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vtherm_api
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

  vtherm:
    name: Versatile Thermostat integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vtherm_api (tested commit)
        uses: actions/checkout@v4
        with:
          path: vtherm_api

      - name: Checkout versatile_thermostat (main)
        uses: actions/checkout@v4
        with:
          repository: jmcollin78/versatile_thermostat
          ref: main
          path: versatile_thermostat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install VTherm test dependencies
        working-directory: versatile_thermostat
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Replace the PyPI vtherm_api distribution with the tested checkout
        working-directory: vtherm_api
        run: |
          python -m pip uninstall -y vtherm_api
          python -m pip install --no-deps -e .
          python -m pip check

      # Not run from the workspace root: its vtherm_api/ checkout folder would shadow the install.
      - name: Check that vtherm_api is imported from the tested checkout
        working-directory: versatile_thermostat
        env:
          API_SRC: ${{ github.workspace }}/vtherm_api/src
        run: |
          origin=$(python -c "import vtherm_api; print(vtherm_api.__file__)")
          echo "vtherm_api imported from $origin"
          case "$origin" in
            "$API_SRC"/*) ;;
            *) echo "::error::vtherm_api is not imported from the tested checkout ($API_SRC)"; exit 1 ;;
          esac

      - name: Run VTherm tests
        working-directory: versatile_thermostat
        env:
          PYTHONPATH: ${{ github.workspace }}/vtherm_api/src
        run: |
          python -m pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            -o console_output_style=count \
            -p no:respx \
            -p no:sugar \
            tests
